# ralph + tmux + Ghostty (Linux). Add to ~/.tmux.conf:   source-file /path/to/ralph-kit/tmux/ralph.tmux.conf

# Let notifications and bells reach Ghostty
set -g allow-passthrough on
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# Status bar shows which projects are waiting on you
set -g status-interval 5
set -ag status-right ' #[fg=yellow,bold]#(ralph attention)#[default]'

# prefix + v : push-to-talk (answers a pending question, otherwise opens/resumes the PRD conversation)
bind-key v display-popup -E -w 80% -h 70% -d '#{pane_current_path}' 'ralph talk'
# prefix + a : answer the pending question by voice
bind-key a display-popup -E -w 70% -h 35% -d '#{pane_current_path}' 'ralph answer'
# prefix + S : hear the status
bind-key S run-shell -b 'cd "#{pane_current_path}" && ralph status --speak >/dev/null'
# prefix + R : status popup
bind-key R display-popup -E -w 80% -h 60% -d '#{pane_current_path}' 'ralph status; ralph log -n 15; read -n1'
